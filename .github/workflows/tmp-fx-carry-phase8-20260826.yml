name: tmp-fx-carry-phase8-20260826
on:
  push:
    branches: ["tmp/xauusd-v04-backtest-20260826"]
    paths:
      - "tmp/fx_universe_download_20260826.js"
      - "tmp/fx_carry_phase8_20260826.py"
      - ".github/workflows/tmp-fx-carry-phase8-20260826.yml"
jobs:
  research:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/xauusd-v04-backtest-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save dukascopy-node
      - run: pip install -q pandas numpy requests
      - run: node tmp/fx_universe_download_20260826.js
      - run: python tmp/fx_carry_phase8_20260826.py
      - name: Persist summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/fx_carry_phase8_20260826_result.json
          git commit -m 'chore: persist temporary FX carry phase8 result' || exit 0
          git pull --rebase origin tmp/xauusd-v04-backtest-20260826 || true
          git push origin HEAD:tmp/xauusd-v04-backtest-20260826

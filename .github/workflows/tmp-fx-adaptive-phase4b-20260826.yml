name: TEMP FX Adaptive Phase4B 20260826
on:
  push:
    branches: ['tmp/xauusd-v04-backtest-20260826']
    paths:
      - '.github/workflows/tmp-fx-adaptive-phase4b-20260826.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/xauusd-v04-backtest-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save dukascopy-node
      - run: pip install -q pandas numpy
      - run: node tmp/fx_trend_download_20260826.js
      - name: Patch temporary pandas Series column access
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp/fx_adaptive_phase4_20260826.py')
          s=p.read_text()
          s=s.replace('a>r.dt', 'a>r[\'dt\']')
          s=s.replace('active.append(r.end)', 'active.append(r[\'end\'])')
          p.write_text(s)
          PY
      - run: python tmp/fx_adaptive_phase4_20260826.py
      - name: Persist summary
        run: |
          git pull --rebase origin tmp/xauusd-v04-backtest-20260826 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/fx_adaptive_phase4_20260826_result.json
          git commit -m 'chore: persist temporary adaptive FX phase4b result' || exit 0
          git push origin HEAD:tmp/xauusd-v04-backtest-20260826
